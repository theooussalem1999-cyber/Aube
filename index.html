  function aboutHTML() {
    return sheetHead('La méthode') + `<div class="prose" style="padding-bottom:12px">
      <p>Aube applique des principes simples et reconnus de l'entraînement en endurance musculaire. Voici comment le programme est construit, et pourquoi.</p>
      <h3>Le rythme de la semaine</h3>
      <p>La première semaine compte déjà : chaque séance finit par une série au maximum, qui recale tout de suite le programme si ton test t'a sous-estimé. Après chaque séance, la question sur les pompes ou les crunchs ne règle que cet exercice, et celle sur le circuit ne règle que le circuit.</p>
      <p>Les grosses séances de pompes tombent les lundis, mercredis et vendredis, celles de crunchs les mardis, jeudis et samedis, comme dans les programmes de type « 100 pompes en 6 semaines ». Les crunchs continuent les autres jours en version modérée.</p>
      <h3>La récupération</h3>
      <p>Un muscle progresse pendant qu'il récupère. L'ACSM recommande au moins 48 heures entre deux séances qui sollicitent fortement les mêmes muscles. Les grosses séances de pompes (lundi, mercredi, vendredi) sont donc toujours séparées de 48 heures, et de 72 heures du vendredi au lundi. Les jours d'abdos, deux petites séries très faciles entretiennent le geste sans gêner la récupération ; tu peux les désactiver dans les réglages. Les abdos travaillent tous les jours, mais en alternant jours durs et jours modérés. Le dimanche, repos complet.</p>
      <h3>Séries longues, repos courts</h3>
      <p>Pour l'endurance musculaire, l'American College of Sports Medicine recommande des répétitions nombreuses (plus de 15) avec des repos courts (moins de 90 secondes). Les séries sont calculées en pourcentage de ta capacité et les repos s'allongent quand les séries grandissent.</p>
      <h3>Trois formats qui alternent</h3>
      <p>Classique (la dernière série au maximum), pyramide (on monte puis on redescend), densité (beaucoup de séries courtes). La variété évite la monotonie et le maximum de fin de séance mesure en continu tes progrès.</p>
      <h3>L'adaptation</h3>
      <p>Chaque niveau représente une capacité environ 4 % plus haute que le précédent. Toutes les séries réussies : +1 niveau. Trop facile avec un gros maximum : +2. Ton maximum dépasse ce que le programme prévoyait : il rattrape d'un coup. Séance ratée ou trop dure : −1. Douleur : −2 et un conseil de repos.</p>
      <h3>Le cycle de 4 semaines</h3>
      <p>Trois semaines de charge croissante, puis une semaine allégée à 60 % qui laisse le corps assimiler. Le test du samedi recale ton niveau sur la réalité.</p>
      <h3>La durée des séances</h3>
      <p>Aube est ton seul sport. L'OMS recommande aux adultes 150 à 300 minutes d'activité modérée par semaine et du renforcement de tous les grands groupes musculaires au moins deux jours par semaine. Une séance dure environ 25 minutes au début et s'allonge à mesure que tes séries grandissent : six séances couvrent ce minimum, avec jambes, dos, cardio et souplesse pour équilibrer les pompes et les crunchs.</p>
      <h3>L'échauffement</h3>
      <p>Six versions tournent : trois pour les jours de pompes (épaules, poignets, haut du dos), trois pour les jours de crunchs (hanches, bassin, abdominaux profonds). Chacune commence par de la marche sur place pour monter doucement en température, et finit au sol, prête pour la suite.</p>
      <h3>Le circuit</h3>
      <p>Cinq exercices de jambes, de dos, de gainage ou de cardio, en nombre de répétitions à faire à ton rythme : personne ne t'impose une cadence. Seules les positions tenues (planche, gainage latéral, chaise) sont chronométrées. Deux séries par exercice par défaut, 30 secondes de repos entre deux, puis 40 secondes pour préparer l'exercice suivant, dont l'écran montre déjà la fiche.</p>
      <p>Les doses de départ sont volontairement prudentes. Après chaque séance, une deuxième question porte sur le circuit seul : facile, il monte de deux crans (environ 15 % de répétitions en plus) ; juste bien, d'un cran ; trop dur, il baisse nettement. Le cardio (jumping jacks, montées de genoux, burpees…) a son propre niveau, séparé du renforcement, parce que l'endurance progresse à un autre rythme que la force.</p>
      <p>L'intensité doit rester modérée : tu dois pouvoir dire quelques mots en faisant l'effort. Une nausée est le signe d'un effort trop intense pour ton niveau du moment. Pour l'éviter : pas de repas copieux dans l'heure qui précède, un verre d'eau avant de commencer, et ralentis dès que tu te sens mal.</p>
      <h3>La souplesse</h3>
      <p>Chaque séance se termine par 5 à 9 minutes d'étirements statiques, quand les muscles sont chauds. Trois thèmes reviennent deux fois par semaine : hanches et adducteurs (lundi, jeudi), ischios et mollets (mardi, vendredi), hanches, cuisses et fessiers (mercredi, samedi), plus les pectoraux après les pompes et le cobra après les crunchs. Le dimanche, une séance douce facultative reprend tout le corps.</p>
      <p>Une revue de 2018 montre que c'est le temps total d'étirement par semaine qui fait progresser, avec au moins 5 séances par semaine. L'ACSM conseille de tenir chaque position jusqu'à une tension légère, sans douleur, et de cumuler environ 60 secondes par exercice. Aube commence à 30 secondes par position et par côté, puis monte jusqu'à 60 secondes au fil des cycles. Si tu tiens souvent plus longtemps que prévu, le repère monte plus vite.</p>
      <p>Le chrono est un repère : il sonne quand le temps visé est atteint, puis continue de compter. C'est toi qui passes à la suite, et chaque position attend ton Go pour te laisser le temps de t'installer. Les longs étirements sont placés après l'effort : tenus plus de 60 secondes par muscle juste avant un effort, ils peuvent réduire un peu la force (Behm, 2016).</p>
      <p>Toutes les 4 semaines, le bilan souplesse mesure trois choses au mètre ruban : la distance doigts-sol, l'écart entre les talons jambes écartées et la hauteur des genoux en papillon.</p>
      <h3>Le programme dos (provisoire)</h3>
      <p>Quand rentrer le menton tire au milieu du dos, les muscles ne sont pas seuls en cause : quand la colonne s'enroule, la moelle épinière et ses enveloppes s'allongent aussi, et un manque de mobilité de ces tissus peut se ressentir comme un tiraillement. Le comparer tête relâchée puis menton rentré aide à faire la différence : si la flexion avant est nettement plus courte menton rentré, la piste nerveuse est probable.</p>
      <p>Plutôt que de forcer l'étirement, le programme fait bouger la colonne segment par segment (bascule du bassin, chat-vache, rotations, enroulé vertébral), étire doucement les lombaires, et ajoute des glissements neuraux : on tend la jambe en relevant la tête, puis on plie la jambe en rentrant le menton, pour faire coulisser le nerf sans le mettre en tension aux deux bouts. Une revue de 2017 trouve un effet favorable de ces mobilisations sur les douleurs chroniques du dos et du cou, avec des preuves encore limitées.</p>
      <p>Le matin, les disques sont gorgés d'eau après la nuit et supportent moins bien les flexions marquées. Limiter la flexion dans l'heure qui suit le lever a réduit des douleurs lombaires chroniques dans un essai (Snook, 1998). D'où le conseil de faire la routine le soir. Quatre semaines, des doses qui montent chaque semaine, et des mesures les jours 1, 8, 15, 22 et 28. Ce programme est à part : il ne touche ni à ta série, ni à tes niveaux, ni à ton XP.</p>
      <p><b>Consulte un médecin</b> si tu ressens une décharge électrique dans le dos ou les membres en baissant la tête, des fourmillements, un engourdissement ou une faiblesse, une douleur qui réveille la nuit, ou si la gêne augmente malgré des mouvements plus doux.</p>
      <h3>L'ordre des exercices</h3>
      <p>Échauffements, circuits et étirements sont rangés par position : d'abord debout, puis à genoux ou à quatre pattes, sur le ventre, assis et enfin sur le dos. Tu ne te relèves pas entre deux exercices au sol.</p>
      <h3>Pourquoi des crunchs</h3>
      <p>Le sit-up complet sollicite fortement les fléchisseurs de la hanche et le bas du dos. Les travaux du biomécanicien Stuart McGill ont conduit beaucoup de programmes, dont « 200 sit-ups », à lui préférer le crunch. Les exercices de dos (superman, bird dog) équilibrent le travail en flexion.</p>
      <h3>Pourquoi 40 pompes est un cap</h3>
      <p>Une étude de Harvard publiée dans JAMA Network Open en 2019 a suivi 1 104 pompiers pendant 10 ans : ceux qui faisaient plus de 40 pompes avaient beaucoup moins d'événements cardiovasculaires que ceux qui en faisaient moins de 10. C'est une association observée chez des hommes actifs, pas une preuve de cause, mais c'est un beau jalon.</p>
      <h3>La série et les jokers</h3>
      <p>Une habitude met en moyenne 66 jours à devenir automatique, avec de grandes différences d'une personne à l'autre, et rater un jour isolé ne compromet pas sa formation (Lally et coll., University College London, 2010). D'où les jokers : un jour manqué ne casse pas ta série si tu en as un.</p>
      <h3>Sources</h3>
      <ul class="small">
        <li>ACSM, Progression models in resistance training for healthy adults, Med Sci Sports Exerc, 2009.</li>
        <li>ACSM, Quantity and quality of exercise for developing and maintaining fitness in apparently healthy adults, Med Sci Sports Exerc, 2011.</li>
        <li>OMS, Lignes directrices sur l'activité physique et la sédentarité, 2020.</li>
        <li>Yang J. et coll., Association between push-up exercise capacity and future cardiovascular events among active adult men, JAMA Network Open, 2019.</li>
        <li>Lally P. et coll., How are habits formed: modelling habit formation in the real world, European Journal of Social Psychology, 2010.</li>
        <li>Mazéas A. et coll., Evaluating the effectiveness of gamification on physical activity, Journal of Medical Internet Research, 2022.</li>
        <li>McGill S., Low Back Disorders, Human Kinetics.</li>
        <li>Thomas E. et coll., The relation between stretching typology and stretching duration: the effects on range of motion, International Journal of Sports Medicine, 2018.</li>
        <li>ACSM, Progression models in resistance training : 1 à 3 séries de 8 à 12 répétitions pour débuter.</li>
        <li>Basson A. et coll., The effectiveness of neural mobilization for neuromusculoskeletal conditions: a systematic review and meta-analysis, Journal of Orthopaedic and Sports Physical Therapy, 2017.</li>
        <li>Snook S. et coll., The reduction of chronic nonspecific low back pain through the control of early morning lumbar flexion, Spine, 1998.</li>
        <li>Behm D. et coll., Acute effects of muscle stretching on physical performance, range of motion, and injury incidence, Applied Physiology, Nutrition, and Metabolism, 2016.</li>
      </ul>
      <p class="small muted">Aube ne remplace pas un avis médical. Une douleur vive, une gêne dans la poitrine, un essoufflement inhabituel ou des nausées à chaque séance : arrête et consulte.</p></div>`;
  }

  let P = null;
  const roundList = (b, r) => (r % 2 === 1 && b.alt && b.alt.length) ? b.alt : b.items;
  function buildSteps(plan) {
    const steps = [];
    const goAll = S.settings.waitGo === 'all';
    plan.blocks.forEach((b, bi) => {
      if (b.kind === 'intervals') {
        steps.push({ t: 'intro', b, bi });
        const waitGo = b.role === 'warmup' || goAll;
        for (let r = 0; r < b.rounds; r++) {
          const list = roundList(b, r);
          if (r > 0) steps.push({ t: 'round', b, bi, r });
          list.forEach((it, j) => {
            if (waitGo || (r === 0 && j === 0)) steps.push({ t: 'ready', b, bi, it, r, n: j, of: list.length });
            steps.push({ t: 'work', b, bi, it, r, n: j, of: list.length, sec: it.work });
            const nx = list[j + 1];
            if (it.rest > 0 && nx) steps.push({ t: 'rest', b, bi, sec: it.rest, next: nx.name, nextId: nx.id, nextIt: nx, nextN: j + 1, of: list.length });
          });
        }
      } else if (b.kind === 'sets') {
        if (b.restBefore) steps.push({ t: 'rest', b, bi, sec: b.restBefore, next: b.title });
        steps.push({ t: 'intro', b, bi });
        b.sets.forEach((s, si) => {
          steps.push({ t: 'set', b, bi, s, si });
          if (s.rest > 0) { const n = b.sets[si + 1]; steps.push({ t: 'rest', b, bi, sec: s.rest, nextId: b.ex, next: n ? (n.isMax ? 'Série au maximum' : n.target + ' ' + A.EX[b.ex].unit) : '' }); }
        });
      } else if (b.kind === 'circuit') {
        steps.push({ t: 'intro', b, bi });
        b.items.forEach((it, j) => {
          if (it.mode === 'stretch') { steps.push({ t: 'stretch', b, bi, it, ii: j }); return; }
          for (let k = 0; k < it.sets; k++) {
            (it.mode !== 'reps' && it.uni ? [1, 2] : [0]).forEach(side => steps.push({ t: 'cset', b, bi, it, j, k, side, of: b.items.length }));
            if (k < it.sets - 1) steps.push({ t: 'rest', b, bi, sec: it.rest, next: `Série ${k + 2} sur ${it.sets} : ${doseShort(it, false)}`, nextId: it.id });
            else if (j < b.items.length - 1 && b.transition) { const nx = b.items[j + 1]; steps.push({ t: 'rest', b, bi, sec: b.transition, next: nx.name, nextId: nx.id, nextIt: nx, nextN: j + 1, of: b.items.length }); }
          }
        });
      } else if (b.kind === 'stretch') {
        steps.push({ t: 'intro', b, bi });
        b.items.forEach((it, ii) => steps.push({ t: 'stretch', b, bi, it, ii }));
      } else if (b.kind === 'flextest') {
        b.items.forEach((key, ii) => steps.push({ t: 'flextest', b, bi, key, ii }));
      } else if (b.kind === 'test') {
        steps.push({ t: 'test', b, bi, ex: b.ex });
      } else if (b.kind === 'pause') {
        steps.push({ t: 'rest', b, bi, sec: b.seconds, next: 'Test crunchs', note: b.note });
      }
    });
    if (plan.kind === 'train') steps.push({ t: 'feeling', bi: plan.blocks.length });
    return steps;
  }

        ${nextP ? `<p class="small muted">Prochaine séance : ${DAYS[nextP.dow]}, ${focusLabel(nextP)}${nextP.formatLabel ? ', ' + nextP.formatLabel.toLowerCase() : ''}.</p>` : ''}
      </div><div class="pfoot"><button class="btn btn-sun btn-block" data-act="p-close">Fermer</button></div>`;
    const target = sum.xp, t0 = performance.now();
    (function tick(t) { const f = Math.min(1, (t - t0) / 1100); const v = Math.round(target * (1 - Math.pow(1 - f, 3))); const e = $('#xp-count'); if (e) e.textContent = '+' + nf(v) + ' XP'; if (f < 1) requestAnimationFrame(tick); })(t0);
    chime(); buzz([80, 60, 120]);
    if (sum.prs.length || sum.badges.length || after.level > before.level || P.plan.kind === 'test') setTimeout(confetti, 250);
    say(P.plan.kind === 'test' ? 'Test terminé. Bravo.' : `Bravo. ${target} points d'expérience.`);
    wakeOff();
  }

  /* ---------- Événements ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-tab],[data-tab-go]');
    if (!t) { if (e.target.id === 'sheet') closeSheet(); return; }
    if (t.dataset.tab) { tab = t.dataset.tab; openDay = null; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.tabGo) { tab = t.dataset.tabGo; closeSheet(); render(); window.scrollTo(0, 0); return; }
    const a = t.dataset.act;
    switch (a) {
      case 'onb-next': if (onbStep === 0) { const n = $('#name-input'); S.name = n ? n.value.trim().slice(0, 30) : S.name; save(); } onbStep++; render(); window.scrollTo(0, 0); break;
      case 'onb-back': onbStep = Math.max(0, onbStep - 1); render(); break;
      case 'onb-later': onbStep = 3; S.seenIntro = true; save(); render(); break;
      case 'start-test': onbStep = 3; S.seenIntro = true; save(); closeSheet(); startSession(A.testPlan(today(), S)); break;
      case 'start-flex': startSession(A.flexPlan(S, today())); break;
      case 'flexcheck': closeSheet(); startSession(A.flexCheckPlan(today())); break;
      case 'flexintro-hide': S.flexIntroSeen = true; save(); render(); break;
      case 'start-back': { const z = $('#back-set'); S = A.startBack(S, today()); S.backIntroSeen = true; save(); if (z) z.innerHTML = '<h3>Programme dos</h3>' + backSettingsHTML(); render(); toast('Programme dos lancé : jour 1 sur ' + A.BACK_DAYS); break; }
      case 'stop-back': { const z = $('#back-set'); S = A.stopBack(S, today()); save(); if (z) z.innerHTML = '<h3>Programme dos</h3>' + backSettingsHTML(); render(); toast('Programme dos arrêté. Tes mesures restent dans Progrès.'); break; }
      case 'backintro-hide': S.backIntroSeen = true; save(); render(); break;
      case 'start-back-routine': startSession(A.backPlan(S, today())); break;
      case 'start-today': startSession(A.planDay(S, today(), { today: true, light: lightToday })); break;
      case 'settings': openSheet(settingsHTML()); bindSettings(); if (t.dataset.focus) { const el = $('#' + t.dataset.focus); if (el) el.scrollIntoView(); } break;
      case 'close-sheet': closeSheet(); render(); break;
      case 'about': openSheet(aboutHTML()); break;
      case 'show-tech': openSheet(sheetHead('Les deux gestes') + `<div class="stack" style="gap:18px;padding-bottom:16px">${techHTML()}</div>`); break;
      case 'badge': badgeSheet(t.dataset.id); break;
      case 'guide': guideSheet(t.dataset.id); break;
      case 'hist-all': showAllHist = true; render(); break;
      case 'day': openDay = openDay === t.dataset.day ? null : t.dataset.day; render(); break;
      case 'install': if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
      case 'set': {
        const k = t.dataset.k, v = t.dataset.v;
        S.settings[k] = k === 'cadence' ? parseFloat(v) : k === 'csets' ? parseInt(v, 10) : (k === 'flexHold' && v !== 'auto') ? parseInt(v, 10) : v; save(); applyTheme();
        t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
        break;
      }
      case 'export': doExport(); break;
      case 'share': doShare(); break;
      case 'copy': doCopy(); break;
      case 'paste-open': { const z = $('#paste-zone'); z.hidden = !z.hidden; break; }
      case 'paste-import': importText(($('#paste-text') || {}).value || ''); break;
      case 'force-test': S.forceTest = true; save(); closeSheet(); tab = 'home'; render(); toast('Le test remplace la séance d\'aujourd\'hui'); break;
      case 'reset': $('#reset-zone').innerHTML = `<div class="banner rose" style="margin-top:10px"><span class="bar"></span><div class="grow stack" style="gap:10px"><p><b>Tout effacer ?</b> Tes séances, records et médailles seront supprimés de ce téléphone.</p><div class="row"><button class="btn btn-quiet btn-s" data-act="reset-no">Annuler</button><button class="btn btn-s" style="background:var(--rose);color:#fff" data-act="reset-yes">Effacer</button></div></div></div>`; break;
      case 'reset-no': $('#reset-zone').innerHTML = ''; break;
      case 'reset-yes': S = A.newState(); save(); onbStep = 0; tab = 'home'; closeSheet(); render(); break;
      // lecteur
      case 'p-exit': if (!$('#player .confirm')) $('#player').insertAdjacentHTML('beforeend', confirmHTML()); break;
      case 'p-stay': { const c = $('#player .confirm'); if (c) c.remove(); break; }
      case 'p-quit': closePlayer(); break;
      case 'p-next': P.paused = false; next(); break;
      case 'p-skipblock': skipBlock(); break;
      case 'p-skipex': P.i++; next(); break;
      case 'p-sskip': next(); break;
      case 'p-go': {
        const s = cur();
        if (s.t === 'ready') countdown(s.b.title, s.it.name, s.it.id, () => next());
        else if (s.t === 'cset') countdown(s.b.title, s.it.name, s.it.id, () => { P.sub.phase = 'run'; P.sub.start = Date.now(); P.sub.lastBeep = null; stepCset(s); });
        else if (s.t === 'stretch') countdown(s.b.title, s.it.name, s.it.id, () => { P.sub.phase = 'hold'; P.sub.start = Date.now(); P.sub.reached = false; P.sub.lastBeep = null; stepStretch(s); });
        break;
      }
      case 'p-snext': {
        const s = cur(), sub = P.sub; clearInterval(P.timer);
        P.log.stretch.push({ id: s.it.id, side: s.it.uni ? sub.side : 0, target: s.it.hold, sec: Math.round((Date.now() - sub.start) / 1000), base: s.it.base });
        if (s.it.uni && sub.side === 1) { P.sub = { mode: 'stretch', phase: 'prep', side: 2 }; saveRun(); stepStretch(s); }
        else next();
        break;
      }
      case 'p-fskip': next(); break;
      case 'p-pause': {
        if (P.paused) { P.paused = false; P.endAt = Date.now() + P.remain * 1000; }
        else { P.paused = true; P.remain = Math.max(0, (P.endAt - Date.now()) / 1000); }
        clearInterval(P.timer); stepTimed(cur(), false);
        break;
      }
      case 'p-add15': P.endAt += 15000; cur().sec += 15; break;
      case 'p-done': { const s = cur(); if (s.t === 'cset') recordCset(s, s.it.target); else recordSet(s, s.s.target); break; }
      case 'p-cstop': { const s = cur(); clearInterval(P.timer); recordCset(s, Math.min(s.it.target, (Date.now() - P.sub.start) / 1000)); break; }
      case 'p-cskip': next(); break;
      case 'p-count': openCounter(); break;
      case 'p-entry': { const s = cur(); P.sub = { mode: 'entry', value: s.t === 'set' ? (s.s.isMax ? s.s.min : Math.max(0, s.s.target - 1)) : s.t === 'cset' ? Math.max(0, s.it.target - 1) : 0 }; s.t === 'cset' ? stepCset(s) : showStep(); break; }
      case 'p-adj': { P.sub.value = Math.min(P.sub.max || Infinity, Math.max(0, P.sub.value + parseInt(t.dataset.d, 10))); const n = $('#entry-num'); if (n) n.textContent = P.sub.value; const b = $('#entry-btn'); if (b) b.textContent = P.sub.value; break; }
      case 'p-validate': { const v = P.sub.value; P.sub = null; recordSet(cur(), v); break; }
      case 'p-feel': P.feeling = parseInt(t.dataset.v, 10); P.pain = !!($('#pain') || {}).checked; stepFeeling(); break;
      case 'p-cfeel': P.cfeel = parseInt(t.dataset.v, 10); P.pain = !!($('#pain') || {}).checked; stepFeeling(); break;
      case 'p-finish': if (P.feeling && (!hasCircuit() || P.cfeel)) { P.pain = !!($('#pain') || {}).checked; finish(); } break;
      case 'p-close': closePlayer(); break;
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'light-toggle') { lightToday = e.target.checked; render(); }
    if (e.target.id === 'pain' && P) P.pain = e.target.checked;
  });
  function bindSettings() {
    const name = $('#set-name'); if (name) name.addEventListener('input', () => { S.name = name.value.trim().slice(0, 30); save(); });
    document.querySelectorAll('[data-sw]').forEach(i => i.addEventListener('change', () => { S.settings[i.dataset.sw] = i.checked; save(); if (i.dataset.sw === 'voice' && i.checked) say('Coach vocal activé.'); if (i.dataset.sw === 'sound' && i.checked) beep(880, .12); }));
    const rem = $('#set-reminder'); if (rem) rem.addEventListener('change', () => { S.settings.reminder = rem.value || '07:00'; save(); const g = $('#gcal'); if (g) g.href = gcalUrl(); });
    const gp = $('#goal-p'), gc = $('#goal-c');
    const upd = () => { const p = parseInt(gp.value, 10), c = parseInt(gc.value, 10); if (p >= 10 && p <= 500) S.settings.goals.pushup = p; if (c >= 20 && c <= 2000) S.settings.goals.crunch = c; save(); };
    if (gp) gp.addEventListener('change', upd); if (gc) gc.addEventListener('change', upd);
    const f = $('#import-file'); if (f) f.addEventListener('change', () => { const file = f.files && f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => importText(String(r.result || '')); r.readAsText(file); });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (P) wakeOn(); else render(); }
    else if (P) saveRun();
  });
  window.addEventListener('pagehide', () => { if (P) saveRun(); });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!P) render(); });
  window.addEventListener('appinstalled', () => { installEvt = null; toast('Aube est installée'); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  /* ---------- Démarrage ---------- */
  (async function boot() {
    const loaded = await Store.load();
    if (loaded) S = A.migrate(loaded);
    if (S.startDate || S.seenIntro) onbStep = 3;
    const d = A.detrain(S, today()); if (d) { S = d; save(); }
    const fresh = A.checkBadges(S, today()); if (fresh.length) save();
    try { if (navigator.storage && navigator.storage.persisted) window.__aubePersisted = await navigator.storage.persisted(); } catch (e) { /* rien */ }
    render();
    const run = loadRun();
    if (run) {
      const fresh = run.date === today() && Date.now() - (run.savedAt || 0) < 4 * 3600e3;
      const alreadyDone = run.plan.kind === 'back' ? A.backStatus(S, run.date).doneToday : run.plan.kind !== 'flexcheck' && A.sessionOn(S, run.date);
      if (fresh && !alreadyDone) { resumeRun(run); toast('Séance reprise là où tu l\'avais laissée'); }
      else clearRun();
    }
    if (!window.__AUBE_PREVIEW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      try {
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register('sw.js');
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController) return;
          if (!P) location.reload(); else toast('Nouvelle version prête : elle s\'appliquera à la prochaine ouverture.');
        });
      } catch (e) { /* rien */ }
    }
    window.__aube = { get state() { return S; }, get player() { return P ? { i: P.i, t: (P.steps[P.i] || {}).t, sets: P.log.sets.length, stretch: P.log.stretch.length } : null; }, A };
  })();
})();

</script>
