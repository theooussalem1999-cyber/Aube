:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
img{max-width:100%}
/* Aube : le ciel est la seule audace. Tout le reste est calme : listes à filets, chiffres condensés, une colonne. */
:root {
  /* Couleur */
  --bg: #EDF0F7;          /* ciel pâle du matin */
  --surface: #FFFFFF;
  --sunk: #E2E6F1;
  --line: #D3D8E8;
  --ink: #1A1E3A;         /* encre bleu nuit */
  --muted: #586083;
  --sun: #F2A22C;         /* disque solaire, actions principales */
  --sun-ink: #8C4A00;     /* texte d'accent lisible sur fond clair */
  --on-sun: #2A1600;
  --rose: #D9536F;        /* aube rose : difficile, douleur, abdos */
  --teal: #12917C;        /* réussite, constance */
  --violet: #6556C9;      /* jalons spéciaux */
  --sky: #2E7CC9;         /* souplesse */
  --shadow: 0 1px 2px rgba(26, 30, 58, .06), 0 8px 24px rgba(26, 30, 58, .08);
  /* Type */
  --display: 'Big Shoulders Display', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fs-xs: .8125rem; --fs-s: .9375rem; --fs-m: 1.0625rem; --fs-l: 1.375rem; --fs-xl: 2rem; --fs-xxl: 3rem;
  /* Mise en page */
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --tabs-h: 64px;
  --maxw: 560px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11142A; --surface: #1A1E3C; --sunk: #232849; --line: #2C3159; --ink: #ECEEF8; --muted: #A2A7C7;
    --sun: #F5AE3D; --sun-ink: #FFC86E; --on-sun: #2A1600; --rose: #FF8AA4; --teal: #4FD3B7; --violet: #A69AFF; --sky: #7DB8F0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11142A; --surface: #1A1E3C; --sunk: #232849; --line: #2C3159; --ink: #ECEEF8; --muted: #A2A7C7;
  --sun: #F5AE3D; --sun-ink: #FFC86E; --on-sun: #2A1600; --rose: #FF8AA4; --teal: #4FD3B7; --violet: #A69AFF; --sky: #7DB8F0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--fs-m)/1.5 var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: var(--fs-xxl); }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-l); font-weight: 700; }
p { margin: 0; }
.num { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-s); }
.xs { font-size: var(--fs-xs); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.wrap { padding-left: var(--gut-l); padding-right: var(--gut-r); max-width: var(--maxw); margin: 0 auto; width: 100%; }
.section { padding-block: 22px; display: flex; flex-direction: column; gap: 14px; }
.section + .section { border-top: 1px solid var(--line); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 22px; border-radius: 999px; border: 0;
  font-weight: 700; font-size: var(--fs-m); text-decoration: none;
  transition: transform .12s ease, filter .12s ease;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-sun { background: var(--sun); color: var(--on-sun); box-shadow: 0 6px 18px color-mix(in srgb, var(--sun) 40%, transparent); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn-quiet { background: var(--sunk); color: var(--ink); }
.btn-block { width: 100%; }
.btn-s { min-height: 40px; padding: 0 16px; font-size: var(--fs-s); }
.link { background: none; border: 0; padding: 4px 0; color: var(--sun-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: inherit; }
.iconbtn svg { width: 24px; height: 24px; }

/* ---------- Ciel (l'élément signature) ---------- */
.sky { position: relative; overflow: hidden; color: #fff; isolation: isolate; }
.sky-inner { position: relative; z-index: 3; padding-top: 12px; min-height: 290px; display: flex; flex-direction: column; }
.sky-top { display: flex; align-items: center; justify-content: space-between; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 1.5rem; letter-spacing: .04em; }
.sky-greet { margin-top: 18px; }
.sky-greet h1 { font-size: clamp(2.4rem, 11vw, 3.4rem); }
.sky-greet p { opacity: .85; margin-top: 4px; }
.sky-caption { margin-top: auto; padding-bottom: 46px; font-size: var(--fs-s); opacity: .92; max-width: 26ch; }
.sky-caption b { font-family: var(--display); font-size: 1.6rem; font-weight: 800; display: block; line-height: 1; }
.sky-sun { position: absolute; z-index: 1; width: 92px; height: 92px; border-radius: 50%; right: 18%; transform: translate(50%, 50%);
  background: radial-gradient(circle at 50% 50%, #FFF6D8 0 30%, #FFD36E 52%, #F7A531 72%, rgba(247, 165, 49, 0) 74%);
  box-shadow: 0 0 60px 30px rgba(255, 196, 92, .35), 0 0 140px 70px rgba(255, 150, 90, .18); }
.stars { position: absolute; inset: 0; z-index: 0; }
.land { position: absolute; left: 0; right: 0; bottom: -1px; z-index: 2; width: 100%; height: 64px; display: block; }
.land path { fill: var(--bg); }
.land path.far { fill: color-mix(in srgb, var(--bg) 55%, #2A2F5A); opacity: .55; }

/* ---------- Onboarding ---------- */
.onb { min-height: 100%; display: flex; flex-direction: column; }
.onb .sky-inner { min-height: 46vh; }
.onb-body { padding-block: 8px 32px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: var(--fs-s); }
.input { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 16px; font-size: var(--fs-m); }
.input:focus { border-color: var(--sun); outline: none; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--sun-ink); }
.steps b { display: block; }
.tech { display: flex; flex-direction: column; gap: 6px; padding-left: 14px; border-left: 3px solid var(--sun); }
.tech.rose { border-left-color: var(--rose); }
.tech ul { margin: 4px 0 0; padding-left: 18px; }
.tech li + li { margin-top: 3px; }

/* ---------- Accueil ---------- */
.today-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.sun { background: color-mix(in srgb, var(--sun) 22%, transparent); color: var(--sun-ink); }
.chip.teal { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal); }
.chip.rose { background: color-mix(in srgb, var(--rose) 16%, transparent); color: var(--rose); }
.chip.violet { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet); }
.plan-list { list-style: none; margin: 0; padding: 0; }
.plan-list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.plan-list li:last-child { border-bottom: 0; }
.plan-list .what { font-weight: 700; }
.plan-list .detail { grid-column: 1 / -1; color: var(--muted); font-size: var(--fs-s); }
.plan-list .dur { color: var(--muted); font-size: var(--fs-s); font-variant-numeric: tabular-nums; }
.setline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.setline span { font-family: var(--display); font-weight: 700; font-size: 1.15rem; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 8px; background: var(--sunk); font-variant-numeric: tabular-nums; }
.setline span.max { background: color-mix(in srgb, var(--sun) 24%, transparent); color: var(--sun-ink); }
.toggle-light { display: flex; align-items: center; gap: 10px; font-size: var(--fs-s); color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.banner .bar { width: 4px; align-self: stretch; border-radius: 4px; background: var(--sun); flex: none; }
.banner.rose .bar { background: var(--rose); }
.banner.teal .bar { background: var(--teal); }

.streak { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.flame { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: color-mix(in srgb, var(--sun) 20%, transparent); color: var(--sun-ink); }
.flame svg { width: 28px; height: 28px; }
.jokers { display: flex; gap: 4px; }
.jokers i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sun); display: block; }
.jokers i.on { background: var(--sun); }

.goal { display: flex; flex-direction: column; gap: 8px; }
.goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.goal-top .num { font-size: 2.2rem; line-height: 1; }
.goal-top .of { font-family: var(--display); font-weight: 700; font-size: 1.2rem; color: var(--muted); }
.gauge { position: relative; height: 14px; border-radius: 999px; background: var(--sunk); overflow: visible; }
.gauge .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, #F7C25B, var(--sun)); }
.gauge.rose .fill { background: linear-gradient(90deg, #F59AAE, var(--rose)); }

.gauge .tick::before { content: ''; position: absolute; left: 50%; top: -6px; width: 1px; height: 5px; background: var(--line); }
.goal-foot { margin-top: 14px; font-size: var(--fs-s); color: var(--muted); }

.xpbar { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--violet); border-radius: 999px; }

.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); }

/* ---------- Semaine ---------- */
.days { list-style: none; margin: 0; padding: 0; }

.day .ddetail { padding: 0 0 16px 66px; display: flex; flex-direction: column; gap: 10px; }

.cycle-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: var(--fs-xs); color: var(--muted); }
.cycle-labels .now { color: var(--sun-ink); font-weight: 700; }

/* ---------- Progrès ---------- */
.records { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.record { display: flex; flex-direction: column; gap: 2px; }
.record .num { font-size: 3.4rem; line-height: .95; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .goal-line { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1.2; }
.legend { display: flex; gap: 16px; font-size: var(--fs-s); color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 16px; }
.stats div { display: flex; flex-direction: column; }
.stats .num { font-size: 1.8rem; line-height: 1.05; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.hist li .xp { font-family: var(--display); font-weight: 700; color: var(--violet); }

/* ---------- Trophées ---------- */
.rank { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.rank .lvl { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--violet) 30%, var(--surface)), var(--surface)); border: 3px solid var(--violet); }

.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 18px 10px; }

.medal .disc { --c: var(--sun); width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 34%, var(--surface)), color-mix(in srgb, var(--c) 10%, var(--surface)) 70%);
  border: 3px solid var(--c); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px color-mix(in srgb, var(--c) 50%, transparent); }
.medal .disc b { font-family: var(--display); font-weight: 800; font-size: 1.35rem; color: color-mix(in srgb, var(--c) 70%, var(--ink)); line-height: 1; }
.medal.push .disc { --c: var(--sun); }
.medal.crunch .disc { --c: var(--rose); }
.medal.regular .disc { --c: var(--teal); }
.medal.special .disc { --c: var(--violet); }

.medal.locked .disc b { color: var(--line); }
.medal span { font-size: var(--fs-xs); line-height: 1.25; max-width: 11ch; }

.fig { display: block; width: 100%; height: auto; color: var(--ink); overflow: visible; }

.gstage { border-radius: 20px; background: var(--sunk); padding: 10px 18px 4px; }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 6px var(--gut-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut-l); }

#sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 12, 30, .45); }
#sheet .panel { width: 100%; max-width: var(--maxw); max-height: 92%; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 8px var(--gut-r) calc(28px + env(safe-area-inset-bottom, 0px)) var(--gut-l); animation: up .22s ease-out; }
#sheet .grab { width: 44px; height: 5px; border-radius: 5px; background: var(--line); margin: 6px auto 10px; }

@keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 12px; font-size: var(--fs-s); font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.switch { position: relative; width: 52px; height: 32px; flex: none; }

.switch input:checked { background: var(--teal); }
.switch input::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch input:checked::after { transform: translateX(20px); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 62ch; }
.prose h3 { margin-top: 8px; }
.prose ul { margin: 0; padding-left: 20px; }
.prose li + li { margin-top: 6px; }
.prose a { color: var(--sun-ink); }
textarea.input { min-height: 120px; padding: 12px; font-size: var(--fs-xs); font-family: ui-monospace, monospace; }

/* ---------- Lecteur de séance ---------- */
#player { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#player.rest-mode { background: #1B2048; color: #F2F3FB; }
#player .ptop { display: flex; align-items: center; gap: 8px; padding: 8px var(--gut-r) 6px var(--gut-l); }
#player .ptop .grow { display: flex; flex-direction: column; }
#player .ptitle { font-weight: 700; font-size: var(--fs-s); }
#player .psub { font-size: var(--fs-xs); opacity: .75; }
.pprog { display: flex; gap: 3px; padding: 0 var(--gut-r) 0 var(--gut-l); }
.pprog i { flex: 1; height: 4px; border-radius: 4px; background: color-mix(in srgb, currentColor 16%, transparent); }
.pprog i.done { background: var(--teal); }
.pprog i.now { background: var(--sun); }
#player .pbody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; justify-content: safe center; gap: 14px; text-align: center; padding: 12px var(--gut-r) 12px var(--gut-l); min-height: 0; overflow: auto; }
#player .pfoot { padding: 10px var(--gut-r) 18px var(--gut-l); display: flex; flex-direction: column; gap: 10px; max-width: var(--maxw); width: 100%; margin: 0 auto; }
.giant { font-family: var(--display); font-weight: 800; font-size: clamp(7rem, 42vw, 13rem); line-height: .85; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.pname { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1; }
.phow { max-width: 34ch; color: var(--muted); }
#player.rest-mode .phow, #player.rest-mode .muted { color: #B9BEE0; }
.ring { width: min(64vw, 260px); aspect-ratio: 1; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .track { stroke: rgba(255, 255, 255, .12); }
.ring .arc { stroke: var(--sun); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring .num { font-size: clamp(4rem, 22vw, 6rem); position: relative; }
.tbar { width: min(100%, 420px); height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--sun); border-radius: 999px; transition: width .25s linear; }
.stepper { display: grid; grid-template-columns: repeat(2, 56px) 1fr repeat(2, 56px); gap: 8px; align-items: center; width: min(100%, 420px); }
.stepper button { height: 56px; border-radius: 16px; border: 0; background: var(--sunk); font-family: var(--display); font-weight: 800; font-size: 1.3rem; }
.stepper .num { font-size: 4.2rem; line-height: 1; }
.tapzone { position: fixed; inset: 0; z-index: 35; background: #0F1230; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tapzone .giant { font-size: clamp(9rem, 55vw, 18rem); }
.tapzone .hint { opacity: .7; max-width: 30ch; text-align: center; font-size: var(--fs-s); }

.choice { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: min(100%, 420px); }
.choice button { min-height: 76px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; }
.choice button small { font-weight: 400; color: var(--muted); font-size: var(--fs-xs); }

.check { display: flex; align-items: center; gap: 10px; font-size: var(--fs-s); }

.confirm { position: absolute; inset: auto 0 0 0; z-index: 5; background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
  padding: 22px var(--gut-r) calc(22px + env(safe-area-inset-bottom, 0px)) var(--gut-l); display: flex; flex-direction: column; gap: 12px; animation: up .2s ease-out; }
.result-list { list-style: none; margin: 0; padding: 0; width: min(100%, 440px); text-align: left; }
.result-list li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.result-list li .detail { grid-column: 1 / -1; color: var(--muted); font-size: var(--fs-s); }
.xpgain { font-family: var(--display); font-weight: 800; font-size: clamp(4rem, 20vw, 6rem); color: var(--violet); line-height: 1; }
.newmedals { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.newmedals .medal { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }

#confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; width: 100%; height: 100%; }
#toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: var(--fs-s); font-weight: 700; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (min-width: 700px) {
  .sky-inner { min-height: 330px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.ring.small { width: min(38vw, 150px); }
.ring.small .num { font-size: clamp(2.6rem, 12vw, 3.4rem); }
.nextcard { display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(100%, 440px); padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, .14); }

#player.rest-mode .chip.sun { background: rgba(245, 174, 61, .22); color: #FFC86E; }

<script>window.AUBE_VERSION = '1.4.1';
/* ==========================================================================
   AUBE · moteur de programme (pur, sans DOM)
   Toute la logique d'entraînement, d'adaptation et de récompense vit ici.
   ========================================================================== */
const Aube = (() => {
  'use strict';

  /* ---------- Dates (clé locale 'AAAA-MM-JJ', midi pour éviter les pièges de l'heure d'été) ---------- */
  const pad = n => String(n).padStart(2, '0');
  const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };

  const dow = k => parseKey(k).getDay(); // 0 = dimanche
  const mondayOf = k => { const w = dow(k); return addDays(k, w === 0 ? -6 : 1 - w); };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const r5 = x => Math.round(x / 5) * 5;

  /* ---------- Exercices objectifs ----------
     Chaque niveau L correspond à une capacité projetée cap(L) = base × ratio^L.
     Pompes : +4 % par niveau. Crunchs : +4,5 % par niveau. */
  const EX = {
    pushup: { id: 'pushup', name: 'Pompes', unit: 'pompes', base: 4, ratio: 1.04, spr: 2.0, xp: 1 },
    knee:   { id: 'knee', name: 'Pompes sur les genoux', unit: 'pompes', base: 4, ratio: 1.04, spr: 1.8, xp: 0.5 },

        if (x.feeling === 4 && !x.pain && t && d / t >= .97 && x.levelsBefore && x.levelsAfter && x.levelsAfter[x.ex] < x.levelsBefore[x.ex] && out.levels[x.ex] === x.levelsAfter[x.ex]) out.levels[x.ex] = x.levelsBefore[x.ex];
      });
      out.repairs.push('feel13');
    }
    return out;
  }

  const mainEx = (st, focus) => focus === 'crunch' ? 'crunch' : (st.pushVariant === 'knee' ? 'knee' : 'pushup');
  const goalLevelCap = (st, ex) => {
    const g = ex === 'crunch' ? st.settings.goals.crunch : (ex === 'pushup' ? st.settings.goals.pushup : 40);
    return levelFor(ex, g * 1.1) + 1;
  };
  const sessionOn = (st, k) => st.sessions.find(s => s.date === k) || null;

  /* ---------- Contexte d'une date ---------- */
  function dayContext(st, k) {
    if (!st.startDate) return { kind: 'before' };
    if (k < st.startDate) return { kind: 'before' };
    const w = dow(k);
    if (k === st.startDate) return { kind: 'test', initial: true, phase: PHASES[0], cycleWeek: 0, cycleIndex: 0 };
    if (w === 0) return { kind: 'rest' };
    if (k < st.anchor) return { kind: 'train', phase: PHASES[0], cycleWeek: 0, cycleIndex: 0, w };
    const weeks = Math.floor(diffDays(st.anchor, k) / 7);
    const cycleWeek = (weeks % 4) + 1, cycleIndex = Math.floor(weeks / 4);
    if (cycleWeek === 4 && w === 6) return { kind: 'test', phase: PHASES[4], cycleWeek, cycleIndex, w };
    return { kind: 'train', phase: PHASES[cycleWeek], cycleWeek, cycleIndex, w };
  }

  /* ---------- Prescription d'un bloc de séries ---------- */
  function buildSets(ex, L, formatId, wf, withMax) {
    const f = FORMATS[formatId];
    const C = cap(ex, L);
    const M = C * wf;
    const rest = r5(f.rest(C));
    let sets = f.sets.map(x => ({ target: Math.max(1, Math.round(x * M)), isMax: false, rest }));
    if (f.max && withMax) {
      sets[sets.length - 1].rest = rest + (f.maxRestAdd || 0);
      sets.push({ target: null, isMax: true, min: Math.max(1, Math.round(f.max * M)), rest: 0 });
    }
    sets[sets.length - 1].rest = 0;
    // plafond de durée du bloc principal
    const est = () => sets.reduce((a, s) => a + (s.isMax ? s.min * 1.3 : s.target) * EX[ex].spr + s.rest, 0);
    let guard = 0;
    while (est() > MAIN_CAP && guard++ < 12) {
      sets = sets.map(s => s.isMax ? s : Object.assign({}, s, { target: Math.max(1, Math.round(s.target * .93)) }));
    }
    return sets;
  }
  const setsSeconds = (ex, sets) => sets.reduce((a, s) => a + (s.isMax ? (s.min || 10) * 1.3 : s.target) * EX[ex].spr + s.rest, 0);

  /* Jours « faciles » : les abdos travaillent tous les jours (3 séries modérées),
     les pompes ne reçoivent que 2 séries très légères, désactivables (repos complet des bras). */
  function rappelSets(st, ex, light) {
    const C = cap(ex, st.levels[ex]);
    if (ex === 'crunch') {
      const t = clamp(Math.round(C * (light ? .38 : .45)), 1, 40);
      if (t >= 25) return [{ target: t, isMax: false, rest: 45 }, { target: t, isMax: false, rest: 0 }];
      return [{ target: t, isMax: false, rest: 45 }, { target: t, isMax: false, rest: 45 }, { target: t, isMax: false, rest: 0 }];
    }
    const t = clamp(Math.round(C * (light ? .25 : .3)), 1, 30);
    return [{ target: t, isMax: false, rest: 45 }, { target: t, isMax: false, rest: 0 }];
  }

  /* ---------- Durée de maintien des étirements ----------
     Repère progressif par cycle (30, 40, 50 puis 60 s), ajusté selon ce que tu tiens vraiment. */
  function flexHold(st, k) {
    const fixed = parseInt(st.settings && st.settings.flexHold, 10);
    if (fixed > 0) return { hold: fixed, base: Math.min(fixed, 40), cycleHold: fixed, why: 'manuel' };
    const ctx = dayContext(st, k);
    const cycleHold = [30, 40, 50, 60][Math.min(3, ctx.cycleIndex || 0)];
    let hold = cycleHold, why = 'progressif';
    const recent = st.sessions.filter(s => s.date < k && s.stretch && s.stretch.length).slice(-6);
    const held = [].concat(...recent.map(s => s.stretch.filter(x => !x.base && x.sec > 0)));
    if (held.length >= 12) {
      const ratio = held.reduce((a, x) => a + Math.min(x.sec, 180), 0) / held.length / cycleHold;
      if (ratio >= 1.5) { hold += 20; why = 'plus'; }
      else if (ratio >= 1.25) { hold += 10; why = 'plus'; }
      else if (ratio < 0.7) { hold -= 10; why = 'moins'; }
    }
    hold = clamp(hold, 20, 90);
    return { hold, base: Math.min(hold, 40), cycleHold, why };
  }
  function stretchItem(id, hold, isBase) {
    return { id, name: LIB[id][0], how: LIB[id][1], pos: posOf(id), uni: UNI.has(id), hold, base: !!isBase };
  }
  const stretchSeconds = b => b.items.reduce((a, it) => a + (it.hold + 12) * (it.uni ? 2 : 1), 0);
  function stretchBlock(st, k, theme, baseKey) {
    const fh = flexHold(st, k), th = THEMES[theme], baseIds = FLEXBASE[baseKey] || [];
    const items = byPos(baseIds.concat(th.items)).map(id => stretchItem(id, baseIds.includes(id) ? fh.base : fh.hold, baseIds.includes(id)));
    return { kind: 'stretch', role: 'flex', theme, title: 'Souplesse : ' + th.title.toLowerCase(), themeTitle: th.title, items, hold: fh.hold, why: fh.why };
  }
  const flexTestBlock = () => ({ kind: 'flextest', role: 'flextest', title: 'Bilan souplesse', items: Object.keys(FT) });
  function warmBlock(st, k, type) {
    const w = dow(k), list = WARMUPS[type] || WARMUPS.push;
    const dayIdx = { 1: 0, 3: 1, 5: 2, 2: 0, 4: 1, 6: 2 }[w] || 0;
    const weekNo = st && st.startDate ? Math.max(0, Math.floor(diffDays(mondayOf(st.startDate), k) / 7)) : 0;
    const ids = byPos(list[(dayIdx + weekNo) % list.length]);
    return { kind: 'circuit', role: 'warmup', title: 'Échauffement', items: ids.map(warmItem), transition: 0 };
  }

  /* Séance facultative du dimanche : réveil doux puis étirements de tout le corps. */
  function flexPlan(st, k) {
    const fh = flexHold(st, k), hold = Math.min(fh.hold, 45);
    const warm = { kind: 'circuit', role: 'warmup', title: 'Réveil en douceur', items: byPos(['march', 'arms', 'hipcircle', 'catcow']).map(warmItem), transition: 0 };
    const block = { kind: 'stretch', role: 'flex', theme: 'S', title: 'Souplesse du dimanche', themeTitle: 'Tout le corps', items: byPos(SUNDAY).map(id => stretchItem(id, hold, false)), hold, why: fh.why };
    return { date: k, dow: dow(k), kind: 'flex', blocks: [warm, block], estSec: 140 + stretchSeconds(block) };
  }
  /* Bilan de souplesse seul, à faire quand on veut. */
  const flexCheckPlan = k => ({ date: k, dow: dow(k), kind: 'flexcheck', blocks: [flexTestBlock()], estSec: 180 });

  /* ---------- Plan d'un test (départ, fin de cycle ou à la demande) ---------- */
  function testPlan(k, st) {
    st = st || newState();
    const W = WEEK[dow(k)];
    const stretch = stretchBlock(st, k, (W && W.theme) || 'C', 'crunch');
    return { date: k, dow: dow(k), kind: 'test', blocks: [warmBlock(st, k, 'push'),
      { kind: 'test', role: 'test', ex: 'pushup', title: 'Test pompes' },
      { kind: 'pause', role: 'pause', title: 'Récupération', seconds: 180, note: 'Marche, respire, secoue les bras. Le test des crunchs arrive.' },
      { kind: 'test', role: 'test', ex: 'crunch', title: 'Test crunchs' },
      flexTestBlock(), stretch], estSec: 210 + 120 + 180 + 300 + 150 + stretchSeconds(stretch) };
  }

  /* ---------- Plan d'une journée ---------- */
  function planDay(st, k, opts) {
    opts = opts || {};
    const ctx = dayContext(st, k);
    const base = { date: k, dow: dow(k), kind: ctx.kind };
    if (ctx.kind === 'before' || ctx.kind === 'rest') return base;

    const isTest = ctx.kind === 'test' || (st.forceTest && opts.today && ctx.kind === 'train');

    if (isTest) return Object.assign(base, testPlan(k, st), { initial: !!ctx.initial, forced: ctx.kind !== 'test', phase: ctx.phase || PHASES[0], cycleWeek: ctx.cycleWeek });

    const W = WEEK[ctx.w];
    const focus = W.focus;
    const warm = warmBlock(st, k, focus === 'crunch' ? 'crunch' : 'push');
    const ex = mainEx(st, focus);
    const other = focus === 'crunch' ? mainEx(st, 'push') : 'crunch';
    const phase = ctx.phase;
    const light = !!opts.light;
    const wf = phase.wf * (light ? .55 : 1);
    const withMax = phase.max && !light;
    const sets = buildSets(ex, st.levels[ex], W.format, wf, withMax);
    const main = { kind: 'sets', role: 'main', ex, title: EX[ex].name, format: W.format, formatLabel: FORMATS[W.format].label, blurb: FORMATS[W.format].blurb, sets, progress: phase.progress && !light };

    const blocks = [warm, main];
    const flex = stretchBlock(st, k, W.theme, focus === 'crunch' ? 'crunch' : 'push');
    let used = circuitSeconds(warm) + setsSeconds(ex, sets) + stretchSeconds(flex);
    const wantRappel = other === 'crunch' || st.settings.pushRappel !== false;
    if (!light && wantRappel) {
      const rs = rappelSets(st, other, phase.id === 4 || phase.id === 0);
      const isC = other === 'crunch';
      blocks.push({ kind: 'sets', role: 'rappel', ex: other, title: EX[other].name + (isC ? ' (entretien)' : ' (rappel)'),
        blurb: isC ? 'Séries modérées : tes abdos travaillent tous les jours, en alternant jours durs et jours faciles.' : 'Deux séries très faciles, loin de l\'échec, pour entretenir le geste sans gêner la récupération.',
        sets: rs, restBefore: 45 });
      used += setsSeconds(other, rs) + 45;
    }
    const mod = MODULES[W.module];
    const nSets = light ? 1 : clamp(parseInt(st.settings.csets, 10) || 2, 1, 3);
    const variant = Math.floor(diffDays(mondayOf(st.startDate), k) / 7) % 2; // une semaine sur deux, l'autre série d'exercices
    const ids = byPos(variant ? mod.alt : mod.items);
    const cblock = { kind: 'circuit', role: 'module', module: W.module, title: mod.title, items: ids.map(id => circuitItem(st, id, nSets)), transition: C_TRANS, variant };
    blocks.push(cblock);
    used += circuitSeconds(cblock);
    blocks.push(flex);
    return Object.assign(base, { focus, ex, other, format: W.format, formatLabel: FORMATS[W.format].label, phase, cycleWeek: ctx.cycleWeek, cycleIndex: ctx.cycleIndex, light, blocks, estSec: Math.round(used) });
  }

  /* ---------- XP et niveaux de joueur ---------- */
  const xpForLevel = n => Math.round(100 * Math.pow(Math.max(0, n - 1), 1.65));
  function playerLevel(xp) {
    let n = 1;
    while (xpForLevel(n + 1) <= xp && n < 99) n++;
    const lo = xpForLevel(n), hi = xpForLevel(n + 1);
    return { level: n, xp, into: xp - lo, span: hi - lo, title: titleFor(n) };
  }
  const TITLES = [[1, 'Somnambule'], [5, 'Lève-tôt'], [10, 'Matinal'], [15, 'Éveillé'], [20, 'Infatigable'], [25, 'Gardien de l\'aube'], [30, 'Spartiate'], [35, 'Titan'], [40, 'Légende'], [50, 'Soleil levant']];
  function titleFor(n) { let t = TITLES[0][1]; TITLES.forEach(([l, name]) => { if (n >= l) t = name; }); return t; }
  const totalXp = st => st.sessions.reduce((a, s) => a + (s.xp || 0), 0);

  /* ---------- Série (streak) rejouée depuis l'historique : déterministe ---------- */
  function streakInfo(st, today) {
    const res = { streak: 0, best: 0, jokers: 1, perfectWeeks: 0, jokerDays: [], missed: [] };
    if (!st.startDate) return res;
    const done = new Set(st.sessions.map(s => s.date));
    let k = st.startDate, guard = 0;
    while (k <= today && guard++ < 4000) {
      const w = dow(k);
      if (w === 0) {
        const mon = addDays(k, -6);
        let all = true, any = false;
        for (let i = 0; i < 6; i++) { const d = addDays(mon, i); if (d < st.startDate) continue; any = true; if (!done.has(d)) all = false; }
        if (any && all) { res.perfectWeeks++; res.jokers = Math.min(3, res.jokers + 1); }
      } else if (done.has(k)) {
        res.streak++; res.best = Math.max(res.best, res.streak);
      } else if (k < today) {
        if (res.jokers > 0) { res.jokers--; res.jokerDays.push(k); } else { res.streak = 0; res.missed.push(k); }
      }
      k = addDays(k, 1);
    }
    return res;
  }

  /* ---------- Records et historique ---------- */
  function noteRecord(st, ex, v, d, src, prs) {
    if (!(v > 0)) return;
    const isPr = v > st.records[ex].v;
    if (src !== 'set' || isPr) st.history[ex].push({ d, v, src: isPr && src === 'set' ? 'max' : src });
    if (isPr) { prs.push({ ex, from: st.records[ex].v, to: v }); st.records[ex] = { v, d }; }
  }

  /* ---------- Application d'une séance terminée ----------
     log = { date, startedAt, completedAt, durSec, feeling (1..4), pain, light,
             sets: [{ex, role, target, done, isMax, min}], intervals: n, tests: {pushup, knee, crunch} } */
  function applySession(stIn, plan, log) {
    const st = JSON.parse(JSON.stringify(stIn));
    const today = log.date;
    const prs = [], changes = [];
    const before = Object.assign({}, st.levels);
    const prevSession = st.sessions.length ? st.sessions[st.sessions.length - 1] : null;
    const gap = prevSession ? diffDays(prevSession.date, today) : 0;
    let xp = 0;

    if (plan.kind === 'test') {
      const t = log.tests || {};
      const prevP = st.records.pushup.v, prevC = st.records.crunch.v;
      noteRecord(st, 'pushup', t.pushup || 0, today, 'test', prs);
      noteRecord(st, 'crunch', t.crunch || 0, today, 'test', prs);
      if (t.knee) noteRecord(st, 'knee', t.knee, today, 'test', prs);
      if ((t.pushup || 0) >= 4) { st.pushVariant = 'standard'; st.levels.pushup = Math.min(levelFor('pushup', t.pushup), goalLevelCap(st, 'pushup')); }
      else { st.pushVariant = 'knee'; st.levels.knee = levelFor('knee', t.knee || 4); st.levels.pushup = levelFor('pushup', t.pushup || 0); }
      st.levels.crunch = Math.min(levelFor('crunch', t.crunch || 0), goalLevelCap(st, 'crunch'));
      if (!st.startDate) { st.startDate = today; st.anchor = addDays(mondayOf(today), 7); }
      st.forceTest = false;
      xp += 100 + Math.round((t.pushup || 0) * EX.pushup.xp + (t.crunch || 0) * EX.crunch.xp + (t.knee || 0) * EX.knee.xp);
      changes.push({ kind: 'test', pushup: t.pushup || 0, crunch: t.crunch || 0, knee: t.knee || 0, prevP, prevC });
    } else if (plan.kind === 'flex') {
      xp += 30;
    } else {
      const mainSets = log.sets.filter(s => s.role === 'main');
      const reg = mainSets.filter(s => !s.isMax);
      const mx = mainSets.find(s => s.isMax);
      const tSum = reg.reduce((a, s) => a + s.target, 0);
      const dSum = reg.reduce((a, s) => a + Math.min(s.done, s.target), 0);
      const c = tSum ? dSum / tSum : 1;
      const ex = plan.ex;
      const L = st.levels[ex];
      let nl = L, why = 'stable';
      const maxOk = !mx || mx.done >= mx.min;
      if (log.pain) { nl = L - 2; why = 'douleur'; }
      else if (log.feeling === 4 || c < .8) { nl = L - 1; why = 'recul'; }
      else if (plan.blocks.find(b => b.role === 'main').progress) {
        if (c >= .97 && maxOk) {
          if (mx && mx.done >= cap(ex, L)) { nl = Math.max(L + 2, levelFor(ex, mx.done)); why = 'bond'; }
          else if (log.feeling === 1 && (!mx || mx.done >= 1.3 * mx.min)) { nl = L + 2; why = 'saut'; }
          else { nl = L + 1; why = 'monte'; }
        } else { why = 'consolide'; }
      }
      nl = clamp(nl, 0, goalLevelCap(st, ex));
      st.levels[ex] = nl;
      changes.push({ kind: 'level', ex, from: L, to: nl, why, completion: c, maxDone: mx ? mx.done : null, maxMin: mx ? mx.min : null });
      log.sets.forEach(s => { if (s.done > 0) noteRecord(st, s.ex, s.done, today, s.isMax ? 'max' : 'set', prs); });
      // knee → standard : si la capacité genoux dépasse 20, on propose un test
      if (ex === 'knee' && cap('knee', nl) >= 20) st.forceTest = true;
      const reps = log.sets.reduce((a, s) => a + s.done * EX[s.ex].xp, 0);
      xp += Math.round(reps) + Math.round((log.workSec != null ? log.workSec : (log.intervals || 0) * 30) / 15) + 40;
      // circuit : niveau « renfo » et niveau « cardio », réglés par la deuxième question et les répétitions faites
      const cs = (log.circuit || []).filter(x => x.role === 'module');
      ['circuit', 'cardio'].forEach(cat => {
        const xs = cs.filter(x => x.cat === cat);
        if (!xs.length) return;
        const tt = xs.reduce((a, x) => a + x.target, 0), dd = xs.reduce((a, x) => a + Math.min(x.done, x.target), 0);
        const cc = tt ? dd / tt : 1, F = log.cfeel || 2, Lc = st.levels[cat] || 0;
        let to = Lc, cwhy = 'stable';
        if (log.pain) { to = Lc - 2; cwhy = 'douleur'; }
        else if (cc < .8) { to = Lc - (F === 4 ? 3 : 1); cwhy = 'recul'; }
        else if (log.light) { to = F === 1 ? Lc + 1 : Lc; cwhy = F === 1 ? 'monte' : 'stable'; }
        else { to = Lc + ({ 1: 2, 2: 1, 3: 0, 4: -2 })[F]; cwhy = F === 1 ? 'saut' : F === 2 ? 'monte' : F === 3 ? 'consolide' : 'recul'; }
        to = clamp(to, -8, 25);
        st.levels[cat] = to;
        changes.push({ kind: 'circuit', cat, from: Lc, to, why: cwhy, completion: cc });
      });
      const perfect = log.sets.every(s => s.isMax ? s.done >= s.min : s.done >= s.target);
      if (perfect) xp += 20;
      if (nl > L) xp += 15 * (nl - L);
      log.perfect = perfect;
    }
    const stretch = (log.stretch || []).map(x => ({ id: x.id, side: x.side || 0, target: x.target || 0, sec: Math.round(x.sec || 0), base: !!x.base }));
    const stretchSec = stretch.reduce((a, x) => a + Math.min(x.sec, 300), 0);
    xp += Math.round(stretchSec / 6);
    const circuit = (log.circuit || []).map(x => ({ id: x.id, role: x.role, cat: x.cat, mode: x.mode, target: x.target, done: x.done }));
    xp += Math.round(circuit.reduce((a, x) => a + (x.mode === 'reps' ? x.done * .3 : x.done / 6), 0));
    const flex = log.flex && Object.keys(log.flex).length ? mergeFlex(st, today, log.flex) : null;
    xp += prs.length * 50;

    const rec = {
      date: today, kind: plan.kind, focus: plan.focus || null, ex: plan.ex || null, format: plan.format || null,
      phase: plan.phase ? plan.phase.name : null, cycleWeek: plan.cycleWeek || 0, light: !!log.light,
      startedAt: log.startedAt, completedAt: log.completedAt, durSec: log.durSec || 0,
      feeling: log.feeling || null, pain: !!log.pain, sets: log.sets || [], intervals: log.intervals || 0,
      tests: log.tests || null, perfect: !!log.perfect, gap,
      levelsBefore: before, levelsAfter: Object.assign({}, st.levels), prs,
      stretch, stretchSec, flex: flex ? flex.vals : null, circuit, cfeel: log.cfeel || null
    };
    st.sessions = st.sessions.filter(s => s.date !== today);
    st.sessions.push(rec);
    st.sessions.sort((a, b) => a.date < b.date ? -1 : 1);
    const si = streakInfo(st, today);
    const mult = si.streak >= 24 ? 1.2 : si.streak >= 6 ? 1.1 : 1;
    rec.xp = Math.round(xp * mult);
    rec.streakMult = mult;
    st.detrained = null;
    const newBadges = checkBadges(st, today);
    st.updatedAt = new Date().toISOString();
    return { state: st, summary: { xp: rec.xp, mult, prs, changes, badges: newBadges, streak: si.streak, record: rec, stretchSec, flex } };
  }

  /* ---------- Programme dos (provisoire, à part du programme principal) ----------
     28 jours, une routine d'une dizaine de minutes, idéalement le soir.
     Il ne touche ni aux séances, ni à la série, ni aux niveaux, ni à l'XP. */
  const BACK_DAYS = 28;
  const BACK_TEST_DAYS = [1, 8, 15, 22, 28];
  const BT = {
    pull: { name: 'Tiraillement au milieu du dos', short: 'Sensation de 0 à 10', fig: 'rolldown', better: 'down', def: 5, unit: '/10', max: 10,
      how: 'Debout, rentre le menton puis enroule doucement les épaules, comme au début de la flexion. Arrête-toi au premier tiraillement et note sa force : 0 = rien, 10 = très fort.' },
    toesRelax: { name: 'Flexion avant, tête relâchée', short: 'Doigts-sol, tête relâchée', fig: 'standfold', better: 'down', def: 22, unit: 'cm',
      how: 'Debout, pieds joints, jambes tendues sans pousser les genoux vers l\'arrière (pas fléchis non plus : garde la même position à chaque mesure). Penche-toi lentement en laissant la tête pendre librement. Mesure la distance entre le bout de tes doigts et le sol (0 si tu touches).' },
    toesTuck: { name: 'Flexion avant, menton rentré', short: 'Doigts-sol, menton rentré', fig: 'rolldown', better: 'down', def: 25, unit: 'cm',
      how: 'Pareil, jambes tendues de la même façon, mais en gardant le menton rentré vers la poitrine. Arrête-toi au premier tiraillement net, sans forcer, et mesure la distance doigts-sol.' }
  };
  // ordre : sur le dos, sur le ventre, à genoux, à quatre pattes, assis sur une chaise, debout ; doses des semaines 1 à 4
  const BACK = [
    ['pelvictilt', 'reps', [10, 12, 15, 15], false, 4],
    ['kneeschest', 'stretch', [30, 40, 45, 60]],
    ['suptwist', 'stretch', [30, 35, 40, 45], true],
    ['cobra', 'stretch', [20, 25, 30, 30]],
    ['child', 'stretch', [40, 45, 60, 60]],
    ['catcow', 'reps', [8, 10, 10, 12], false, 5],
    ['qrot', 'reps', [5, 6, 8, 8], true, 4],
    ['slider', 'reps', [8, 10, 12, 12], true, 3],
    ['rolldown', 'reps', [4, 5, 6, 6], false, 10]
  ];
  const BACK_NOTE = { pelvictilt: 'lentement, au rythme du souffle', catcow: 'lentement, au rythme du souffle', qrot: 'par côté, lentement', slider: 'par jambe, en va-et-vient', rolldown: 'très lentement, 2 respirations en bas' };
  const backDay = (st, k) => st.back && st.back.start ? diffDays(st.back.start, k) + 1 : 0;

        <ol class="steps">
          <li><div><b>Un test de départ</b><span class="muted">Ton maximum de pompes puis de crunchs d'affilée. Il fixe ton niveau.</span></div></li>

  }

  function bannersHTML(k) {

    }

    if (S.startDate && !S.backIntroSeen && !S.back) out.push(`<div class="banner"><span class="bar"></span><div class="grow stack" style="gap:8px"><p><b>Programme dos provisoire</b><br><span class="small muted">4 semaines, une routine d'environ 10 minutes par jour pour assouplir la colonne et calmer le tiraillement quand tu rentres le menton. À part du programme principal, sans effet sur ta série.</span></p><div class="row" style="flex-wrap:wrap"><button class="btn btn-quiet btn-s" data-act="start-back">Commencer</button><button class="link" data-act="backintro-hide">Plus tard</button></div></div></div>`);
    const trains = S.sessions.length;

    return out.length ? `<div class="section" style="gap:10px">${out.join('')}</div>` : '';
  }
  function todayHTML(k) {
    const plan = A.planDay(S, k, { today: true, light: lightToday });
    const sess = A.sessionOn(S, k);
    if (sess) {

      return `<div class="section"><div class="today-head"><h2>${sess.kind === 'flex' ? 'Souplesse faite' : 'Séance faite'}</h2><span class="chip teal">+${sess.xp} XP</span></div>
        <p class="muted">${sessionLine(sess)}</p>
        ${next ? `<p>À ${A.diffDays(k, next.date) === 1 ? 'demain' : DAYS[A.dow(next.date)]} : <b>${up1(DAYS[A.dow(next.date)])}, ${focusLabel(next)}</b>${next.formatLabel ? ', ' + next.formatLabel.toLowerCase() : ''}.</p>` : ''}</div>`;

      <div class="today-head"><h2>${up1(DAYS[plan.dow])}, ${focusLabel(plan)}</h2><span class="chip sun">environ ${fmtMin(plan.estSec)}</span></div>
      <p class="small muted">${esc(phaseChip)}. ${esc(ph.note)}</p>
      ${planListHTML(plan)}
      <button class="btn btn-sun btn-block" data-act="start-today">Commencer la séance</button>
      <label class="toggle-light"><span class="switch"><input type="checkbox" id="light-toggle" ${lightToday ? 'checked' : ''}></span><span>Fatigué ou pressé : version allégée, sans changement de niveau</span></label>
    </div>`;

  function backHTML(k) {
    const bs = A.backStatus(S, k);
    if (!bs.active) return '';
    const note = '<p class="small muted">Programme provisoire, à part : il ne touche ni à ta série, ni à tes niveaux, ni à ton XP. De préférence le soir, ou au moins une heure après le lever.</p>';
    if (bs.finished) {
      const bp = A.backProgress(S);
      const rows = Object.keys(A.BT).filter(key => bp[key]).map(key => { const f = A.BT[key], x = bp[key], u = f.unit === 'cm' ? ' cm' : '/10'; return `<li><span><b>${esc(f.name)}</b></span><span class="small">${x.n > 1 ? `${x.first}${u} → <b>${x.last}${u}</b>` : `${x.last}${u}`}</span></li>`; }).join('');
      return `<div class="section"><div class="today-head"><h3>Programme dos terminé</h3><span class="chip violet">${bs.done} routines</span></div>
        ${rows ? `<ul class="hist">${rows}</ul>` : ''}
        <p class="small muted">Si la gêne a disparu, tu peux arrêter : les étirements des séances entretiennent la souplesse. S'il reste un tiraillement, refais 4 semaines.</p>
        <div class="row" style="flex-wrap:wrap"><button class="btn btn-quiet btn-s grow" data-act="start-back">Recommencer 4 semaines</button><button class="btn btn-ghost btn-s grow" data-act="stop-back">Arrêter</button></div></div>`;
    }
    const nextTest = [1, 8, 15, 22, 28].find(d => d > bs.day);
    if (bs.doneToday) return `<div class="section"><div class="today-head"><h3>Routine dos faite</h3><span class="chip teal">jour ${bs.day} sur ${A.BACK_DAYS}</span></div>
      <p class="small muted">${bs.done} routine${bs.done > 1 ? 's' : ''} depuis le début.${nextTest ? ` Prochaines mesures : jour ${nextTest}.` : ''}</p></div>`;
    const bp = A.backPlan(S, k);
    return `<div class="section"><div class="today-head"><h3>Programme dos, jour ${bs.day} sur ${A.BACK_DAYS}</h3><span class="chip violet">environ ${fmtMin(bp.estSec)}</span></div>
      ${note}${planListHTML(bp)}
      <button class="btn btn-quiet btn-block" data-act="start-back-routine">Commencer la routine dos</button></div>`;
  }
  function nextTraining(k) {
    for (let i = 1; i < 8; i++) { const d = A.addDays(k, i); const p = A.planDay(S, d); if (p.kind === 'train' || p.kind === 'test') return p; }
    return null;
  }
  function sessionLine(s) {
    const flexTxt = s.stretchSec ? ` Souplesse : ${fmtMin(s.stretchSec)}.` : '';
    if (s.kind === 'flex') return `Souplesse du dimanche : ${fmtMin(s.stretchSec || s.durSec)} d'étirements.`;
    if (s.kind === 'test') {
      const t = s.tests || {};
      return `Test : ${t.pushup || 0} pompes${t.knee ? ' (' + t.knee + ' sur les genoux)' : ''} et ${t.crunch || 0} crunchs d'affilée.${flexTxt}`;
    }
    const main = s.sets.filter(x => x.role === 'main');
    const total = main.reduce((a, x) => a + x.done, 0);
    const mx = main.find(x => x.isMax);
    const lb = s.levelsBefore[s.ex], la = s.levelsAfter[s.ex];
    return `${nf(total)} ${s.ex === 'crunch' ? 'crunchs' : 'pompes'}${mx ? ', dernière série à ' + mx.done : ''}. ${la > lb ? 'Niveau ' + lb + ' → ' + la + '.' : la < lb ? 'Niveau ajusté à ' + la + '.' : 'Niveau ' + la + ' conservé.'}${flexTxt}`;
  }
  function streakHTML(k) {
    const si = A.streakInfo(S, k);
    const wv = A.weekView(S, k);
    const jset = new Set(si.jokerDays);
    const strip = wv.days.map(d => {
      const st = d.status === 'missed' && jset.has(d.date) ? 'joker' : d.status;
      return `<div class="wday ${st}"><span class="dot">${d.status === 'done' ? '✓' : A.parseKey(d.date).getDate()}</span><span>${DLET[A.dow(d.date)]}</span></div>`;
    }).join('');
    return `<div class="section">
      <div class="streak"><span class="flame">${icon('flame')}</span>
        <div><div class="num" style="font-size:1.8rem;line-height:1">${plural(si.streak, 'séance')} d'affilée</div><p class="small muted">Record : ${si.best}. Les jokers protègent ta série si tu rates un jour.</p></div>
        <div class="jokers" title="${si.jokers} joker${si.jokers > 1 ? 's' : ''}" aria-label="${si.jokers} joker${si.jokers > 1 ? 's' : ''} sur 3">${[0, 1, 2].map(i => `<i class="${i < si.jokers ? 'on' : ''}"></i>`).join('')}</div></div>
      <div class="weekstrip">${strip}</div>
      <p class="xs muted">Une semaine complète (6 séances sur 6) rapporte un joker, jusqu'à 3.</p>
    </div>`;
  }
  function gaugeHTML(ex, rec, goal, ticks, cls, lvlCap) {
    const pct = v => Math.min(100, v / goal * 100);
    return `<div class="gauge ${cls}"><div class="fill" style="width:${pct(rec)}%"></div>${lvlCap ? `<div class="lvl" style="left:calc(${pct(lvlCap)}% - 1.5px)" title="Niveau du programme"></div>` : ''}

  function goalsHTML(k) {
    const g = S.settings.goals;

    const projTxt = (pr, goal, unit) => !pr ? '' : pr.reached ? `Objectif atteint. Bravo.` : `À ce rythme, ${goal} ${unit} vers ${fmtMonth(pr.date)} (${pr.basis === 'mesures' ? 'estimation d\'après tes mesures' : 'estimation d\'après le programme'}).`;
    const knee = S.pushVariant === 'knee';
    const capP = knee ? 0 : A.cap('pushup', S.levels.pushup), capC = A.cap('crunch', S.levels.crunch);
    const tP = [10, 25, 40, 50, 75, 100].map(x => Math.round(x * g.pushup / 100)).filter((x, i, a) => a.indexOf(x) === i);
    const tC = [50, 100, 150, 200, 250, 300].map(x => Math.round(x * g.crunch / 300)).filter((x, i, a) => a.indexOf(x) === i);
    return `<div class="section" style="gap:26px">
      <h3>Objectifs</h3>
      <div class="goal"><div class="goal-top"><span>Pompes d'affilée</span><span><span class="num">${P}</span> <span class="of">/ ${g.pushup}</span></span></div>
        ${gaugeHTML('pushup', P, g.pushup, tP, '', capP)}
        <p class="goal-foot">${knee ? `Tu t'entraînes sur les genoux (record ${S.records.knee.v}) pour construire la force des pompes classiques.` : `Le programme te prépare en ce moment pour ${capP} (trait foncé).`} ${projTxt(pp, g.pushup, 'pompes')}</p></div>
      <div class="goal"><div class="goal-top"><span>Crunchs d'affilée</span><span><span class="num">${C}</span> <span class="of">/ ${g.crunch}</span></span></div>

  function levelHTML() {

  /* ---------- Semaine ---------- */
  function viewWeek() {
    const k = today();
    if (!S.startDate) return `<div class="wrap section" style="padding-top:28px"><h2>Ta semaine</h2><p class="muted">Ton programme apparaîtra ici après le test de départ.</p><button class="btn btn-sun btn-block" data-act="start-test">Passer le test</button></div>`;
    const isSun = A.dow(k) === 0;

    if (isSun) {
      const wv = A.weekView(S, k);
      const done = wv.days.filter(d => d.status === 'done');
      const xp = done.reduce((a, d) => a + (d.session.xp || 0), 0);
      const reps = ex => done.reduce((a, d) => a + (d.session.sets || []).filter(s => s.ex === ex).reduce((b, s) => b + s.done, 0) + ((d.session.tests || {})[ex] || 0), 0);
      html += `<div class="section" style="padding-top:28px"><h2>Bilan de la semaine</h2>
        <div class="stats"><div><span class="num">${done.length}/6</span><span class="small muted">séances</span></div><div><span class="num">${nf(xp)}</span><span class="small muted">XP gagnés</span></div>
        <div><span class="num">${nf(reps('pushup') + reps('knee'))}</span><span class="small muted">pompes</span></div><div><span class="num">${nf(reps('crunch'))}</span><span class="small muted">crunchs</span></div></div></div>`;
      html += weekBlock(A.addDays(k, 1), k, 'La semaine prochaine');
    } else {
      html += weekBlock(k, k, 'Cette semaine', true);
    }
    return html + '</div>';
  }
  function weekBlock(ref, k, title, top) {
    const mon = A.mondayOf(ref);
    const ctx = A.dayContext(S, mon >= S.startDate ? mon : A.addDays(S.startDate, 1));
    const si = A.streakInfo(S, k);
    const jset = new Set(si.jokerDays);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = A.addDays(mon, i);
      const plan = A.planDay(S, d, { today: d === k });
      const sess = A.sessionOn(S, d);
      let status = plan.kind === 'rest' ? 'rest' : plan.kind === 'before' ? 'before' : sess ? 'done' : d < k ? 'missed' : d === k ? 'today' : 'upcoming';
      days.push({ d, plan, sess, status });
    }
    const end = A.addDays(mon, 6);
    let cyc = '';
    if (ctx.phase && ctx.phase.id > 0) {
      const names = ['Construction', 'Progression', 'Surcharge', 'Récup. et test'];
      cyc = `<div class="stack" style="gap:6px"><div class="cycle">${[1, 2, 3, 4].map(w => `<div class="${w < ctx.cycleWeek ? 'past' : w === ctx.cycleWeek ? 'now' : ''}"></div>`).join('')}</div>
        <div class="cycle-labels">${names.map((n, i) => `<span class="${i + 1 === ctx.cycleWeek ? 'now' : ''}">${n}</span>`).join('')}</div>
        <p class="small muted">Cycle ${ctx.cycleIndex + 1}, semaine ${ctx.cycleWeek} sur 4. ${esc(ctx.phase.note)}</p></div>`;
    } else if (ctx.phase) {
      cyc = `<p class="small muted">Semaine de découverte : volume réduit pour apprendre les gestes. Le premier cycle commence le lundi ${fmtShort(S.anchor)}.</p>`;
    }
    const rows = days.map(x => {
      const p = x.plan, dt = A.parseKey(x.d);
      let chip = '', main = '', sub = '';
      if (p.kind === 'rest') { main = 'Repos'; sub = '<span class="small muted">Souplesse douce facultative</span>'; chip = x.sess ? '<span class="chip teal">Souplesse faite</span>' : '<span class="chip">Repos</span>'; }
      else if (p.kind === 'before') { main = 'Avant le départ'; chip = ''; }
      else {
        main = p.kind === 'test' ? 'Test pompes et crunchs' : up1(focusLabel(p)) + ', ' + p.formatLabel.toLowerCase();
        const mb = p.blocks.find(b => b.role === 'main');
        sub = mb ? setChips(mb.sets) : (x.sess && x.sess.kind === 'test' ? '' : '<span class="small muted">Maximum de chaque exercice</span>');
        if (x.status === 'done') { chip = '<span class="chip teal">Faite</span>'; sub = `<span class="small muted">${esc(sessionLine(x.sess))}</span>`; }
        else if (x.status === 'missed') chip = jset.has(x.d) ? '<span class="chip sun">Joker</span>' : '<span class="chip">Manquée</span>';
        else if (x.status === 'today') chip = '<span class="chip sun">Aujourd\'hui</span>';
        else chip = p.kind === 'test' ? '<span class="chip violet">Test</span>' : `<span class="chip">${fmtMin(p.estSec)}</span>`;
      }
      const dp = p.kind === 'rest' && S.startDate && x.d > S.startDate ? A.flexPlan(S, x.d) : p;
      const open = openDay === x.d && dp.blocks;
      return `<li class="day ${x.d === k ? 'is-today' : ''}"><button data-act="day" data-day="${x.d}" aria-expanded="${open ? 'true' : 'false'}">
          <span class="dnum"><b>${dt.getDate()}</b><span>${DAYS[dt.getDay()].slice(0, 3)}.</span></span>
          <span class="dmain"><strong>${esc(main)}</strong>${sub}</span>${chip}</button>
          ${open ? `<div class="ddetail">${x.sess ? sessionDetail(x.sess) : planListHTML(dp)}</div>` : ''}</li>`;
    }).join('');
    return `<div class="section" ${top ? 'style="padding-top:28px"' : ''}><h2>${title}</h2><p class="muted">${rangeTxt(mon, end)}. Les séances à venir s'ajustent après chaque séance.</p>${cyc}<ul class="days">${rows}</ul></div>`;
  }
  function rangeTxt(a, b) {
    const da = A.parseKey(a), db = A.parseKey(b);
    return da.getMonth() === db.getMonth() ? `Du ${da.getDate()} au ${db.getDate()} ${MONTHS[db.getMonth()]}` : `Du ${da.getDate()} ${MONTHS[da.getMonth()]} au ${db.getDate()} ${MONTHS[db.getMonth()]}`;
  }
  function sessionDetail(s) {
    if (s.kind === 'test' || s.kind === 'flex') return `<p>${esc(sessionLine(s))}</p>`;
    const feel = ['', 'Facile', 'Juste bien', 'Dur', 'Trop dur'][s.feeling || 0] || '';
    const bySets = r => s.sets.filter(x => x.role === r);
    const line = r => bySets(r).map(x => x.isMax ? `<span class="max">${x.done}</span>` : `<span>${x.done}${x.done < x.target ? '/' + x.target : ''}</span>`).join('');
    return `<div class="stack" style="gap:8px"><div class="setline">${line('main')}</div>
      ${bySets('rappel').length ? `<p class="small muted">Rappel : ${bySets('rappel').map(x => x.done).join(' + ')} ${bySets('rappel')[0].ex === 'crunch' ? 'crunchs' : 'pompes'}</p>` : ''}
      <p class="small muted">${feel ? 'Ressenti : ' + feel.toLowerCase() + '. ' : ''}${s.durSec ? 'Durée : ' + fmtMin(s.durSec) + '. ' : ''}${s.light ? 'Version allégée.' : ''}${s.pain ? ' Douleur signalée.' : ''}</p></div>`;
  }

  /* ---------- Progrès ---------- */
  function lineChart(ex, goal, color) {
    const pts0 = S.history[ex].slice().sort((a, b) => a.d < b.d ? -1 : 1);
    const byDay = {}; pts0.forEach(p => { if (!byDay[p.d] || byDay[p.d].v < p.v) byDay[p.d] = p; });
    const pts = Object.values(byDay).sort((a, b) => a.d < b.d ? -1 : 1);
    if (!pts.length) return '<p class="small muted">Pas encore de mesure. Ton test de départ apparaîtra ici.</p>';
    const k = today();
    const pr = A.projection(S, ex, goal, k);
    const W = 340, H = 180, pl = 34, pr2 = 12, pt = 14, pb = 26;
    const d0 = pts[0].d;
    let d1 = pts[pts.length - 1].d > k ? pts[pts.length - 1].d : k;
    const showProj = pr && !pr.reached && pr.date;
    if (showProj) d1 = pr.date;
    const span = Math.max(14, A.diffDays(d0, d1));
    const yMax = Math.max(goal, ...pts.map(p => p.v));
    const x = d => pl + A.diffDays(d0, d) / span * (W - pl - pr2);
    const y = v => pt + (1 - v / yMax) * (H - pt - pb);
    const gridV = [0, .25, .5, .75, 1].map(f => Math.round(yMax * f));
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de ton record de ${A.EX[ex].unit}">`;
    gridV.forEach(v => { s += `<line class="grid" x1="${pl}" x2="${W - pr2}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`; });
    s += `<line class="goal-line" x1="${pl}" x2="${W - pr2}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}"/>`;
    const path = pts.map((p, i) => (i ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    s += `<path d="${path} L${x(last.d).toFixed(1)} ${y(0)} L${x(pts[0].d).toFixed(1)} ${y(0)}Z" fill="${color}" opacity=".14"/>`;
    s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (showProj) s += `<path d="M${x(last.d).toFixed(1)} ${y(last.v).toFixed(1)} L${x(pr.date).toFixed(1)} ${y(goal).toFixed(1)}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="3 5" opacity=".8"/>`;
    pts.forEach(p => { s += `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${p.src === 'test' ? 4.5 : 3}" fill="${p.src === 'test' ? color : 'var(--bg)'}" stroke="${color}" stroke-width="2"/>`; });
    s += `<text x="${pl}" y="${H - 6}" text-anchor="start">${fmtShort(d0)}</text><text x="${W - pr2}" y="${H - 6}" text-anchor="end">${fmtShort(d1)}</text>`;
    s += `<text x="${W - pr2}" y="${(y(goal) - 5).toFixed(1)}" text-anchor="end">objectif ${goal}</text>`;
    return s + '</svg>';
  }
  function weeklyBars(ex, color) {
    const k = today(); const mon = A.mondayOf(k);
    const weeks = []; for (let i = 7; i >= 0; i--) weeks.push(A.addDays(mon, -7 * i));
    const vals = weeks.map(w => S.sessions.filter(s => s.date >= w && s.date < A.addDays(w, 7)).reduce((a, s) => a + (s.sets || []).filter(x => x.ex === ex || (ex === 'pushup' && x.ex === 'knee')).reduce((b, x) => b + x.done, 0) + ((s.tests || {})[ex] || 0), 0));
    const max = Math.max(10, ...vals);
    const W = 340, H = 110, pb = 22, pt = 16, bw = (W - 8) / 8;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${A.EX[ex].unit} par semaine">`;
    vals.forEach((v, i) => {
      const h = v / max * (H - pb - pt); const xx = 4 + i * bw + bw * .18;
      s += `<rect x="${xx.toFixed(1)}" y="${(H - pb - h).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${Math.max(v ? 2 : 0, h).toFixed(1)}" rx="3" fill="${color}" opacity="${i === 7 ? 1 : .55}"/>`;
      if (v) s += `<text x="${(xx + bw * .32).toFixed(1)}" y="${(H - pb - h - 4).toFixed(1)}" text-anchor="middle">${v}</text>`;
      s += `<text x="${(xx + bw * .32).toFixed(1)}" y="${H - 6}" text-anchor="middle">${A.parseKey(weeks[i]).getDate()}/${A.parseKey(weeks[i]).getMonth() + 1}</text>`;
    });
    return s + '</svg>';
  }
  function viewProgress() {
    const g = S.settings.goals;
    const t = A.totals(S); const si = A.streakInfo(S, today());
    let html = `<div class="wrap"><div class="section" style="padding-top:28px"><h2>Tes progrès</h2>
      <div class="records"><div class="record"><span class="small muted">Record pompes</span><span class="num" style="color:var(--sun-ink)">${S.records.pushup.v}</span><span class="xs muted">${S.records.pushup.d ? 'le ' + fmtShort(S.records.pushup.d) : 'pas encore mesuré'}</span></div>
      <div class="record"><span class="small muted">Record crunchs</span><span class="num" style="color:var(--rose)">${S.records.crunch.v}</span><span class="xs muted">${S.records.crunch.d ? 'le ' + fmtShort(S.records.crunch.d) : 'pas encore mesuré'}</span></div></div>
      ${S.records.knee.v ? `<p class="small muted">Record sur les genoux : ${S.records.knee.v} pompes.</p>` : ''}</div>
      <div class="section"><h3>Pompes d'affilée</h3>${lineChart('pushup', g.pushup, 'var(--sun)')}
        <div class="legend"><span><i style="background:var(--sun)"></i>Tests</span><span><i style="background:transparent;border:2px solid var(--sun)"></i>Dernières séries au max</span><span>Pointillés : projection</span></div></div>
      <div class="section"><h3>Crunchs d'affilée</h3>${lineChart('crunch', g.crunch, 'var(--rose)')}</div>
      ${flexProgressHTML(t)}
      ${backProgressHTML()}
      <div class="section"><h3>Volume par semaine</h3><p class="small muted">Pompes</p>${weeklyBars('pushup', 'var(--sun)')}<p class="small muted">Crunchs</p>${weeklyBars('crunch', 'var(--rose)')}</div>
      <div class="section"><h3>Au total</h3><div class="stats">
        <div><span class="num">${nf(t.pushup + t.knee)}</span><span class="small muted">pompes</span></div>
        <div><span class="num">${nf(t.crunch)}</span><span class="small muted">crunchs</span></div>
        <div><span class="num">${S.sessions.length}</span><span class="small muted">séances et tests</span></div>
        <div><span class="num">${nf(t.minutes)}</span><span class="small muted">minutes d'effort</span></div>
        <div><span class="num">${si.best}</span><span class="small muted">meilleure série</span></div>
        <div><span class="num">${si.perfectWeeks}</span><span class="small muted">semaines parfaites</span></div></div></div>`;
    const all = S.sessions.slice().reverse(); const hist = showAllHist ? all : all.slice(0, 8);
    html += `<div class="section"><h3>Historique</h3>${hist.length ? '<ul class="hist">' + hist.map(s => `<li><b>${up1(fmtDate(s.date))}</b><span class="xp">+${s.xp} XP</span><span class="small muted" style="grid-column:1/-1">${esc(sessionLine(s))}</span></li>`).join('') + '</ul>' + (all.length > hist.length ? `<button class="btn btn-quiet btn-block" data-act="hist-all">Afficher les ${all.length} séances</button>` : '') : '<p class="muted">Tes séances apparaîtront ici.</p>'}</div>`;
    return html + '</div>';
  }

  function flexProgressHTML(t) {
    const fp = A.flexProgress(S);
    const rows = Object.keys(A.FT).map(key => {
      const f = A.FT[key], x = fp[key];
      if (!x) return `<li><span><b>${esc(f.name)}</b><span class="small muted" style="display:block">${esc(f.short)}</span></span><span class="small muted">à mesurer</span></li>`;
      const gain = x.n > 1 ? `<span class="small ${x.gain > 0 ? 'good' : 'muted'}">${x.gain > 0 ? '+' + x.gain + ' cm gagnés' : x.gain < 0 ? x.gain + ' cm' : 'stable'}</span>` : '<span class="small muted">point de départ</span>';
      return `<li><span><b>${esc(f.name)}</b><span class="small muted" style="display:block">${esc(f.short)}${x.n > 1 ? ' : ' + x.first + ' → ' + x.last + ' cm' : ''}</span></span><span style="text-align:right"><span class="num" style="font-size:1.6rem">${x.last} cm</span><br>${gain}</span></li>`;
    }).join('');
    const last = (S.flexTests || []).slice(-1)[0];
    return `<div class="section"><div class="today-head"><h3>Souplesse</h3><span class="chip teal">${nf(t.flexSec / 60)} min d'étirements</span></div>
      <ul class="hist">${rows}</ul>
      <p class="small muted">${last ? 'Dernier bilan le ' + fmtShort(last.d) + '. Le bilan revient à chaque test, toutes les 4 semaines.' : 'Le premier bilan sert de point de départ. Il revient ensuite à chaque test, toutes les 4 semaines.'}</p>
      <button class="btn btn-quiet btn-block" data-act="flexcheck">Faire un bilan souplesse maintenant</button></div>`;
  }

  function backProgressHTML() {
    if (!S.back) return '';
    const bp = A.backProgress(S), bs = A.backStatus(S, today());
    const rows = Object.keys(A.BT).map(key => {
      const f = A.BT[key], x = bp[key], u = f.unit === 'cm' ? ' cm' : '/10';
      if (!x) return `<li><span><b>${esc(f.name)}</b><span class="small muted" style="display:block">${esc(f.short)}</span></span><span class="small muted">à mesurer</span></li>`;
      const gain = x.n > 1 ? `<span class="small ${x.gain > 0 ? 'good' : 'muted'}">${x.gain > 0 ? (f.unit === 'cm' ? x.gain + ' cm gagnés' : '−' + x.gain + ' point' + (x.gain > 1 ? 's' : '')) : x.gain < 0 ? 'en hausse' : 'stable'}</span>` : '<span class="small muted">point de départ</span>';
      return `<li><span><b>${esc(f.name)}</b><span class="small muted" style="display:block">${esc(f.short)}${x.n > 1 ? ' : ' + x.first + ' → ' + x.last + u : ''}</span></span><span style="text-align:right"><span class="num" style="font-size:1.6rem">${x.last}${u}</span><br>${gain}</span></li>`;
    }).join('');
    const done = ((S.back.log) || []).filter(x => x.d >= S.back.start).length;
    return `<div class="section"><div class="today-head"><h3>Dos</h3><span class="chip violet">${done} routine${done > 1 ? 's' : ''}</span></div>
      <ul class="hist">${rows}</ul>
      <p class="small muted">${bs.active ? (bs.finished ? 'Programme terminé.' : `Jour ${bs.day} sur ${A.BACK_DAYS}. Mesures les jours 1, 8, 15, 22 et 28.`) : 'Programme arrêté. Tu peux le relancer dans les réglages.'}</p></div>`;
  }

  /* ---------- Gestes ---------- */
  function viewGuide() {
    let html = `<div class="wrap"><div class="section" style="padding-top:28px"><h2>Les gestes</h2>
      <p class="muted">Tous les exercices du programme, en animation, avec les points clés et les erreurs à éviter. Touche un exercice pour l'ouvrir.</p></div>`;
    Guide.GROUPS.forEach(([title, ids]) => {
      html += `<div class="section"><h3>${esc(title)}</h3><ul class="glist">${ids.map(id => `<li><button data-act="guide" data-id="${id}">
        <span class="gthumb">${Guide.svg(id, { label: exName(id) })}</span><span><b>${esc(exName(id))}</b><span class="small muted">${esc(Guide.T[id].m)}</span></span></button></li>`).join('')}</ul></div>`;
    });
    return html + '</div>';
  }
  function guideSheet(id) {
    const t = Guide.T[id]; if (!t) return;
    const list = (arr, cls) => arr && arr.length ? `<${cls === 'ol' ? 'ol' : 'ul class="gerr"'}>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</${cls === 'ol' ? 'ol' : 'ul'}>` : '';
    openSheet(sheetHead(esc(exName(id))) + `<div class="stack" style="gap:18px;padding-bottom:12px">
      <div class="gstage">${Guide.svg(id, { anim: true, label: 'Animation : ' + exName(id) })}</div>
      <div class="row" style="flex-wrap:wrap;gap:8px"><span class="chip sun">${esc(t.m)}</span><span class="chip">${esc(A.posLabel(id))}</span>${t.view ? `<span class="chip">${esc(t.view)}</span>` : ''}</div>
      <div class="gsec"><h3>Comment faire</h3>${list(t.k, 'ol')}</div>
      ${t.e ? `<div class="gsec"><h3>Erreurs fréquentes</h3>${list(t.e)}</div>` : ''}
      ${t.easy || t.hard ? `<div class="gvar">${t.easy ? `<div><b>Plus facile</b><br><span class="muted">${esc(t.easy)}</span></div>` : ''}${t.hard ? `<div class="hard"><b>Plus difficile</b><br><span class="muted">${esc(t.hard)}</span></div>` : ''}</div>` : ''}
      ${t.b ? `<p><b>Respiration :</b> ${esc(t.b)}</p>` : ''}
      ${t.tip ? `<div class="gvar"><div class="hard"><b>Astuce</b><br><span class="muted">${esc(t.tip)}</span></div></div>` : ''}
    </div>`);
  }

  /* ---------- Trophées ---------- */
  function medalHTML(b, got, big) {

  }

        <div class="xpbar"><i style="width:${(pl.into / pl.span * 100).toFixed(1)}%"></i></div>
        <p class="small muted">${nf(pl.xp)} XP. ${nextTitle ? `Prochain titre au niveau ${nextTitle[0]} : ${esc(nextTitle[1])}.` : 'Titre ultime atteint.'}</p></div></div>
      <p class="small muted">Tu gagnes de l'XP à chaque répétition, chaque séance terminée, chaque record et chaque niveau franchi. Ta série multiplie les gains : ×1,1 dès 6 séances d'affilée, ×1,2 dès 24.</p></div>
      <div class="section"><div class="today-head"><h3>Médailles</h3><span class="chip">${got} sur ${A.BADGES.length}</span></div>
      <div class="medals">${A.BADGES.map(b => medalHTML(b, !!S.badges[b.id])).join('')}</div></div>
      <div class="section"><h3>Les titres</h3><ul class="hist">${A.TITLES.map(([l, n]) => `<li><span ${pl.level >= l ? '' : 'class="muted"'}><b>${esc(n)}</b></span><span class="small ${pl.level >= l ? '' : 'muted'}">niveau ${l}</span></li>`).join('')}</ul></div>`;
    return html + '</div>';
  }

  /* ---------- Feuilles ---------- */
  function openSheet(html) {

        <div class="setting"><span class="grow">Séries par exercice du circuit<br><span class="xs muted">Le nombre de répétitions s'adapte à tes réponses après chaque séance.</span></span>${seg('csets', [[1, '1'], [2, '2'], [3, '3']], st.csets || 2)}</div>
        <div class="setting"><span class="grow">Durée des étirements<br><span class="xs muted">Auto : de 30 s à 60 s au fil des cycles, ajustée selon ce que tu tiens vraiment.</span></span>${seg('flexHold', [['auto', 'Auto'], [30, '30 s'], [45, '45 s'], [60, '60 s']], st.flexHold || 'auto')}</div>

        <div class="field grow"><label for="goal-c">Crunchs d'affilée</label><input id="goal-c" class="input" type="number" inputmode="numeric" min="20" max="2000" value="${st.goals.crunch}"></div></div>
        <p class="xs muted">Une fois un objectif atteint, le programme se stabilise à ce niveau. Monte l'objectif pour continuer à progresser.</p>
